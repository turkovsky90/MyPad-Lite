<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head><meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />

  <title>MyPad Lite - A notepad in the browser</title>

  <style>
@charset "utf-8";

html, body { height: 100%; box-sizing: border-box; margin: 0px; background-color: #1e1e1e; color: #d4d4d4; }

body { display: flex; flex-direction: column; }

textarea { flex: 1; box-sizing: border-box; border: none; outline: none; resize: none; font-family: monospace; background-color: #000000; color: #d4d4d4; font-size: 16px; min-height: 0; }

#textbox { border-bottom: 1px solid rgba(68, 68, 68, 0.5); background-color: #000000; width: 100%; padding: 0.5em; overflow-y: scroll; white-space: pre-wrap; }

nav { box-sizing: border-box; width: 100%; padding: 0px 0.5em 0.3em; background-color: #252526; border-top: 1px solid rgba(68, 68, 68, 0.5); line-height: 1.25rem; color: #aaa; font-family: sans-serif; font-size: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; min-height: 2.5rem; }

#stats { font-size: 85%; }

label { font-size: 85%; vertical-align: middle; }

#controls { display: flex; align-items: center; gap: 0.5em; flex-wrap: wrap; }

/* Unified Button Style */
button, #open a, #save a {
  display: inline-block;
  background-color: #3c3c3c;
  color: #d4d4d4;
  border: 1px solid rgba(85, 85, 85, 0.5);
  border-radius: 3px;
  padding: 0.45em 0.6em;
  font-size: 85%;
  font-family: sans-serif;
  text-decoration: none;
  cursor: pointer;
  text-align: center;
  line-height: 1.4;
  box-sizing: border-box;
  vertical-align: middle;
  transition: background-color 0.2s, border-color 0.2s;
}

button:hover, #open a:hover, #save a:hover {
  background-color: #4a4a4a;
  border-color: rgba(119, 119, 119, 0.5);
}

/* Unified Input Field Style */
input[type="text"] {
  background-color: #000000;
  color: #d4d4d4;
  border: 1px solid rgba(85, 85, 85, 0.5);
  border-radius: 3px;
  padding: 0.45em 0.4em;
  font-size: 85%;
  font-family: sans-serif;
  outline: none;
  box-sizing: border-box;
  line-height: 1.4;
  vertical-align: middle;
  width: 7em;
}

#filename { width: 8.4em; }

input[type="text"]:focus {
  border-color: #007acc;
}

input[type="checkbox"] { accent-color: #007acc; vertical-align: middle; }

#open > input { display: none; }

@media print {
  nav { display: none; }
  textarea { height: 100%; border: none; }
}
  </style>
</head>
<body>
  <textarea id="textbox" autofocus="autofocus" placeholder="type here" spellcheck="false"></textarea>
  <nav>
    <span id="stats">
      <span id="char-count-with-spaces">0</span> chars
      <span id="char-count-without-spaces">0</span> no spaces
      <span id="line-count">0</span> lines
    </span>
    <span id="controls">
      <input type="checkbox" id="wrap" checked />
      <label for="wrap">wrap</label>
      <button id="select-all">select all</button>
      <span id="open">
        <input type="file" value="open" />
        <a href="#">open</a>
      </span>
      <span id="save">
        <input id="filename" type="text" value="index.html" placeholder="index.html" />
        <a href="#">save</a>
      </span>
    </span>
  </nav>
  <script>
    const textbox = document.getElementById('textbox');
    const charCountWithSpaces = document.getElementById('char-count-with-spaces');
    const charCountWithoutSpaces = document.getElementById('char-count-without-spaces');
    const lineCount = document.getElementById('line-count');
    const wrapCheckbox = document.getElementById('wrap');

    function updateStats() {
      const text = textbox.value;
      charCountWithSpaces.textContent = text.length;
      charCountWithoutSpaces.textContent = text.replace(/\s/g, '').length;
      lineCount.textContent = text.length === 0 ? 0 : text.split('\n').length;
    }

    // 1. ЗАГРУЗКА из localStorage при старте
    window.addEventListener('DOMContentLoaded', () => {
      const savedText = localStorage.getItem('mypad_lite_text');
      if (savedText !== null) {
        textbox.value = savedText;
      }
      
      const savedWrap = localStorage.getItem('mypad_lite_wrap');
      if (savedWrap !== null) {
        wrapCheckbox.checked = savedWrap === 'true';
      }
      
      // Применяем настройки и обновляем статистику
      applyWrap();
      updateStats();
    });

    function applyWrap() {
      if (wrapCheckbox.checked) {
        textbox.style.whiteSpace = 'pre-wrap';
        textbox.style.overflowX = 'hidden';
      } else {
        textbox.style.whiteSpace = 'pre';
        textbox.style.overflowX = 'auto';
      }
    }

    // 2. СОХРАНЕНИЕ в localStorage при каждом изменении
    textbox.addEventListener('input', () => {
      updateStats();
      localStorage.setItem('mypad_lite_text', textbox.value);
    });

    wrapCheckbox.addEventListener('change', () => {
      localStorage.setItem('mypad_lite_wrap', wrapCheckbox.checked);
      applyWrap();
    });

    document.getElementById('select-all').addEventListener('click', () => {
      textbox.select();
    });

    document.querySelector('#open a').addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelector('#open input').click();
    });

    document.querySelector('#open input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          textbox.value = event.target.result;
          updateStats();
          localStorage.setItem('mypad_lite_text', textbox.value); // Сохраняем открытый файл
        };
        reader.readAsText(file);
      }
    });

    document.querySelector('#save a').addEventListener('click', (e) => {
      e.preventDefault();
      const filename = document.getElementById('filename').value || 'index.html';
      const blob = new Blob([textbox.value], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    });

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
